default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

  host: <%= ENV.fetch("DATABASE_HOST") { "db" } %>
  username: <%= ENV.fetch("POSTGRES_USER") { "postgres" } %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD") { "password" } %>
  port: 5432

development:
  <<: *default

  database: g_scheduler_development

test:
  <<: *default
  database: g_scheduler_test

production:
  <<: *default
  database: g_scheduler_production
  username: g_scheduler
  password: <%= ENV["APP_DATABASE_PASSWORD"] %>